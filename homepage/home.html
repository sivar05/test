<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WILD</title>
  <link rel="stylesheet" href="home.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1 style="text-align:center;"><u><i>WELCOME TO WILD</i></u></h1>

  <div class="marquee-container">
    <div class="marquee-text">
      <span>🦁 -- WELCOME TO OUR WILD -- 🐻</span>
    </div>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <button class="menu_btn" id="menuBtn">☰</button>
  <span onclick="logout()">🚪 Logout</span>
</div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">
  <div class="profile-section">
    <img src="../image/personal/user.png" class="profile-pic">
    <h3>Hi User</h3>
  </div>
  <ul id="menuList"></ul>
</aside>


<!-- GALLERY -->
<div class="container">
  <div class="gallery" id="wildGallery"></div>

  <!-- UPLOAD FORM -->
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="Animal name" required />
    <input type="text" name="action" placeholder="action (lion, tiger...)" required />
    <input type="file" name="image" accept="image/*" required />
    <button type="submit">Upload</button>
  </form>
</div>

<!-- FULLSCREEN VIEW -->
<div id="fullscreen">
  <span id="closeFull" onclick="closeFull()">✖</span>
  <img id="fullImg">
  <div id="imgInfo">
    <h2 id="imgTitle"></h2>
    <p id="imgDesc"></p>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <p>© 2025 WILD. All rights reserved.</p>
</div>

<script src="home.js"></script>
</body>
</html>
